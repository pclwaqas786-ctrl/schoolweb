{% extends "base.html" %}
{% block title %}Notices — {{ school.name }}{% endblock %}
{% block body %}
<h2>Notices</h2>
<nav class="tabs"><a href="{{ url_for('dashboard') }}">← Dashboard</a></nav>
<form method="post" class="form">
  <label>Title<input name="title" required></label>
  <label>Detail<textarea name="body" rows="3"></textarea></label>
  <button class="btn" type="submit">Add Notice</button>
</form>
{% for n in notices %}
<div class="card"><h3>{{ n.title }}</h3><p>{{ n.body }}</p>
<form method="post" class="inline"><button name="delete" value="{{ n.id }}" class="btn small danger">Delete</button></form></div>
{% else %}<p class="muted">Koi notice nahi.</p>{% endfor %}
{% endblock %}
