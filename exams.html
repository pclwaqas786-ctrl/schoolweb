<h2>📊 Exams & Results</h2>
<nav class="tabs"><a href="dashboard.html">← Dashboard</a></nav>
<div class="card">
<h3>➕ New Exam</h3>
<form method="post" class="form" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
  <label>Exam name *<input name="name" required placeholder="First Term 2026"></label>
  <label>Year<input name="year" type="number" value="2026"></label>
  <label style="grid-column:1/-1">Subjects * <small class="muted">(comma se: Urdu,English,Math,Science)</small>
    <input name="subjects" required placeholder="Urdu,English,Math,Science,Islamiat"></label>
  <div><button class="btn small teal">Create Exam</button></div>
</form>
</div>

<div class="card">
  <h3>First Term 2026 <span class="badge approved">2026</span></h3>
  <p class="muted">Urdu,English,Math,Science</p>
  <form method="get" action="exams.html" class="inline">
    <label><small>Class</small> <select name="class"><option>Class 3</option><option>Class 4</option><option>Class 5</option></select></label>
    <button class="btn small teal">✏️ Enter Marks</button>
  </form>
  <form method="get" action="merit.html" class="inline">
    <label><small>Class</small> <select name="class"><option>Class 3</option><option>Class 4</option><option>Class 5</option></select></label>
    <button class="btn small">🏆 Merit List</button>
  </form>
  <form method="post" class="inline"><input type="hidden" name="del" value="1">
    <button class="btn small danger" onclick="return confirm('Exam + saare marks delete?')">✕</button></form>
</div>


<footer class="plain"><p>🏫 SchoolWeb — har school ki apni website. 100% free, hamesha.</p></footer>
