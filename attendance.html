<h2>📋 Attendance</h2>
<nav class="tabs"><a href="dashboard.html">← Dashboard</a></nav>

<section class="stat-cards">
  <div class="stat-card s1"><div class="n">1</div><div class="l">✅ Present</div></div>
  <div class="stat-card s2"><div class="n">1</div><div class="l">❌ Absent</div></div>
  <div class="stat-card s3"><div class="n">1</div><div class="l">⏰ Late</div></div>
  <div class="stat-card s4"><div class="n">0</div><div class="l">🏖️ Leave</div></div>
</section>

<div class="card">
<form method="get" class="form" style="display:flex;gap:10px;align-items:end;flex-wrap:wrap">
  <label>Class<select name="class"><option >Class 3</option><option selected>Class 4</option><option >Class 5</option></select></label>
  <label>Date<input type="date" name="date" value="2026-10-07"></label>
  <div><button class="btn small teal">Show</button></div>
</form>
</div>

<form method="post">
<input type="hidden" name="class" value="Class 4">
<input type="hidden" name="date" value="2026-10-07">
<table>
<tr><th>#</th><th>Student</th><th>Father</th><th colspan="4">Status</th></tr>

<tr><td>1</td><td><b>Ahmed Raza</b></td><td>Rashid Raza</td>

<td><label><input type="radio" name="st_1" value="present" checked> ✅</label></td>
<td><label><input type="radio" name="st_1" value="absent" > ❌</label></td>
<td><label><input type="radio" name="st_1" value="late" > ⏰</label></td>
<td><label><input type="radio" name="st_1" value="leave" > 🏖️</label></td>
</tr>

<tr><td>2</td><td><b>Bilal Ahmed</b></td><td>Naseer Ahmed</td>

<td><label><input type="radio" name="st_3" value="present" > ✅</label></td>
<td><label><input type="radio" name="st_3" value="absent" > ❌</label></td>
<td><label><input type="radio" name="st_3" value="late" checked> ⏰</label></td>
<td><label><input type="radio" name="st_3" value="leave" > 🏖️</label></td>
</tr>

<tr><td>3</td><td><b>Fatima Khan</b></td><td>Imran Khan</td>

<td><label><input type="radio" name="st_2" value="present" > ✅</label></td>
<td><label><input type="radio" name="st_2" value="absent" checked> ❌</label></td>
<td><label><input type="radio" name="st_2" value="late" > ⏰</label></td>
<td><label><input type="radio" name="st_2" value="leave" > 🏖️</label></td>
</tr>

</table>
<button class="btn teal">💾 Save Attendance</button>
</form>
